; PlatformIO 项目配置
; 目标芯片：STM32H743VIT6（Cortex-M7）
; 默认编译和烧录方式：GNU Arm GCC + ST-Link

[platformio]
default_envs = stm32h743vit6
src_dir = .
description = STM32H743 控制板固件

[env:stm32h743vit6]
platform = ststm32
board = devebox_h743vitx
framework = stm32cube
extra_scripts = pre:.vscode/platformio-hardfloat.py

; 本项目沿用现有目录结构，使用自定义启动文件和链接脚本。
build_src_filter =
    +<App/main.c>
    +<App/boot_jump.c>
    +<App/gsa200.c>
    +<App/pcu.c>
    +<App/pcu_position.c>
    +<App/pcu_speed.c>
    +<App/pcu_terminal.c>
    +<App/j8_uart_test.c>
    +<Bsp/LED/bsp_led.c>
    +<Bsp/UART/bsp_uart.c>
    +<Bsp/system_stm32h7xx.c>
    +<Project/GCC/startup_stm32h743xx.c>

build_flags =
    -DSTM32H743xx
    -DUSE_FULL_LL_DRIVER
    -DRAM_DEBUG=0
    -I$PROJECT_DIR/App
    -I$PROJECT_DIR/Bsp
    -I$PROJECT_DIR/Bsp/LED
    -I$PROJECT_DIR/Bsp/UART
    -I$PROJECT_DIR/CMSIS/Inc
    -I$PROJECT_DIR/Driver/Inc
    -I$PROJECT_DIR/Driver/Inc/Legacy
    -I$PROJECT_DIR/STM32H7xx_Device/Inc
    -mcpu=cortex-m7
    -mthumb
    -mfpu=fpv5-d16
    -mfloat-abi=hard
    -ffunction-sections
    -fdata-sections
    -fno-common
    -Wno-override-init
    -Wl,-u,_printf_float

board_build.mcu = stm32h743vit6
board_build.f_cpu = 480000000L
board_build.ldscript = Project/GCC/STM32H743VITX_FLASH.ld
board_build.stm32cube.startup_file = platformio-no-startup.S
board_build.stm32cube.system_file = platformio-no-system.c
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 921600
monitor_echo = yes
monitor_eol = CRLF
; 通过 PlatformIO 构建后，产物位于 .pio/build/stm32h743vit6/。
